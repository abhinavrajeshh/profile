<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abhinav Rajesh</title>
  <meta name="description" content="Abhinav Rajesh — BCA Student and Aspiring Full-Stack Developer.">
  <meta name="theme-color" content="#090B10">
  <link rel="canonical" href="https://abhinavrajesh.in/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23090B10'/%3E%3Ctext x='50' y='66' font-family='system-ui,sans-serif' font-size='46' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EAR%3C/text%3E%3C/svg%3E">

  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <style>
    :root {
      --bg: #090B10;
      --text: #FFFFFF;
      --text-soft: rgba(255, 255, 255, 0.64);
      --text-faint: rgba(255, 255, 255, 0.46);
      --accent: #A78BFA;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-hover: rgba(167, 139, 250, 0.12);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glow: rgba(167, 139, 250, 0.20);
      --status: #34D399;
      --pad: clamp(1.5rem, 5vw, 4rem);
      --font: "Inter", "SF Pro Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    :root[data-theme="light"] {
      --bg: #F7F6F2;
      --text: #12141A;
      --text-soft: rgba(18, 20, 26, 0.68);
      --text-faint: rgba(18, 20, 26, 0.55);
      --accent: #6D4AD6;
      --glass: rgba(18, 20, 26, 0.04);
      --glass-hover: rgba(109, 74, 214, 0.10);
      --glass-border: rgba(18, 20, 26, 0.12);
      --glow: rgba(167, 139, 250, 0.26);
      --status: #16A34A;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      color-scheme: dark;
    }
    html[data-theme="light"] { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ambient glow */
    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(48rem 36rem at 12% 38%, var(--glow), transparent 70%),
        radial-gradient(30rem 24rem at 92% 100%, var(--glow), transparent 75%);
      opacity: 0.8;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(1.5rem, env(safe-area-inset-top, 0px))
        max(var(--pad), env(safe-area-inset-right, 0px))
        max(1.5rem, env(safe-area-inset-bottom, 0px))
        max(var(--pad), env(safe-area-inset-left, 0px));
    }

    /* Header */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 72rem;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      border-radius: 6px;
    }
    .logo span { color: var(--accent); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--status);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--status) 22%, transparent);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      background: var(--glass);
      color: var(--text);
      cursor: pointer;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .theme-toggle:hover {
      background: var(--glass-hover);
      border-color: var(--accent);
    }
    .theme-toggle svg { width: 1.1rem; height: 1.1rem; }

    /* Show the icon for the mode you'll switch to */
    .icon-sun { display: block; }
    .icon-moon { display: none; }
    :root[data-theme="light"] .icon-sun { display: none; }
    :root[data-theme="light"] .icon-moon { display: block; }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 72rem;
      margin: 0 auto;
      padding: 3rem 0;
    }

    .intro { max-width: 40rem; text-align: left; }

    .eyebrow {
      margin: 0 0 1.25rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--text);
    }
    h1 .dot { color: var(--accent); }

    .subtitle {
      margin: 1.5rem 0 0;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      font-weight: 500;
      color: var(--text);
    }

    .description {
      margin: 0.9rem 0 0;
      max-width: 34rem;
      font-size: clamp(1rem, 2.2vw, 1.1rem);
      color: var(--text-soft);
    }

    /* Social buttons */
    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .social-link svg {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      color: var(--accent);
    }
    .social-link:hover {
      transform: translateY(-2px);
      background: var(--glass-hover);
      border-color: var(--accent);
    }

    /* Footer */
    .site-footer {
      width: 100%;
      max-width: 72rem;
      margin: 0 auto;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-faint);
    }
    .site-footer p { margin: 0; }
    .site-footer p + p { margin-top: 0.25rem; }

    /* Keyboard focus */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Small screens */
    @media (max-width: 480px) {
      .socials { gap: 0.6rem; }
      .social-link { padding: 0.6rem 0.95rem; font-size: 0.88rem; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
      .social-link:hover { transform: none; }
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="page">
    <header class="site-header">
      <a class="logo" href="#top" aria-label="Abhinav Rajesh, back to top">AR<span>.</span></a>

      <div class="header-actions">
        <span class="status-dot" aria-hidden="true"></span>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>

          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>

    <main id="top">
      <section class="intro">

        <ul class="socials">
          <li>
            <a class="social-link" href="https://github.com/abhinavrajeshh" target="_blank" rel="noopener noreferrer">

                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path>
              </svg>
              <span>GitHub</span>
            </a>
          </li>
          <li>
            <a class="social-link" href="https://www.linkedin.com/in/abhinavrajeshh/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"></path>
              </svg>
              <span>LinkedIn</span>
            </a>
          </li>
          <li>
            <a class="social-link" href="mailto:abhinavrajeshworks@gmail.com">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
                <path d="m3.5 7.5 8.5 6 8.5-6"></path>
              </svg>
              <span>Email me</span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>A small corner of the internet.</p>
      <p>© 2026 Abhinav Rajesh</p>
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");
      var meta = document.querySelector('meta[name="theme-color"]');

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        toggle.setAttribute(
          "aria-label",
          theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
        );
        if (meta) meta.setAttribute("content", theme === "dark" ? "#090B10" : "#F7F6F2");
      }

      applyTheme(root.getAttribute("data-theme") === "light" ? "light" : "dark");

      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
